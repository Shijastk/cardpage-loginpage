<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://kit.fontawesome.com/yourcode.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>
    <div class="page">
        <aside class="left-side">
            <img src="https://cdn-cms-s-8-4.f-static.net/manager/admin/lw_panel/master-admin/internal_white_images/cardpage/CardPage_Logotype_1_Logotype_Purple_Logo_DarkGrey_Text.png?v=vc1792595110"
                alt="" srcset="">
            <div class="short-line"></div>
            <h1>Build Your Website in Three Easy Steps</h1>
        </aside>



        <main class="main-area">
            <section class="login-card">
                <header class="card-heading">Login</header>
                <div class="card-content">
                    <form>
                        <div class="input-box">
                            <input id="email" name="email" type="email" placeholder="Email Address" required>
                            <span class="icon">
                                <i class="fa-solid fa-user"></i>
                            </span>
                        </div>
                        <div class="input-box">
                            <input id="password" name="password" type="password" placeholder="Password" required>
                            <span class="icon">
                                <i class="fa-solid fa-lock"></i>
                            </span>

                        </div>



                        <a class="forgot-link" href="#">I forgot my password</a>

                        <button type="submit">Login</button>
                    </form>

                    <p class="separator">Or Log in Using</p>
                    <button class="social-button facebook-button" type="button">
                        <img src="https://imgs.search.brave.com/pNj9BAwnOcSkb4InD--icDPbD4RiyxeTt-iJIMabwgQ/rs:fit:500:0:1:0/g:ce/aHR0cHM6Ly9jZG4u/aWNvbnNjb3V0LmNv/bS9pY29uL2ZyZWUv/cG5nLTI1Ni9mcmVl/LWZhY2Vib29rLWxv/Z28taWNvbi1zdmct/ZG93bmxvYWQtcG5n/LTEwOTQ4NTIucG5n/P2Y9d2VicCZ3PTEy/OA"
                            alt="">
                        Login with Facebook</button>
                    <button class="social-button" type="button">
                        <img src="https://imgs.search.brave.com/g-oTmt2DIFyMMde9LN4EVLBKXvNiH3-yGZNL8UFWQmQ/rs:fit:860:0:0:0/g:ce/aHR0cHM6Ly9jZG4u/aWNvbnNjb3V0LmNv/bS9pY29uL2ZyZWUv/cG5nLTI1Ni9mcmVl/LWdvb2dsZS1sb2dv/LWljb24tc3ZnLWRv/d25sb2FkLXBuZy05/MzQxMy5wbmc_Zj13/ZWJwJnc9MTI4"
                            alt="" srcset="">
                        Login with Google</button>
                </div>
            </section>
            <p class="signup">New user? <a href="#">Sign up here.</a></p>
        </main>
    </div>
</body>

</html>
